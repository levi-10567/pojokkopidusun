<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat QR Menu</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#faf6ef;color:#1d2420;padding:16px}
.w{max-width:520px;margin:auto}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
button{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:#12372a;color:#fff;font:700 1rem inherit;cursor:pointer}
.kartu{margin:18px auto;background:#fff;border:2px solid #12372a;border-radius:20px;padding:22px;text-align:center;width:330px}
.kartu b{font:700 1.3rem Georgia,serif;color:#12372a}.kartu h2{margin:4px 0 10px;font-size:1.5rem}canvas{width:100%;image-rendering:pixelated}
.kartu small{color:#666;word-break:break-all;display:block;margin-top:8px}.cat{font-size:.85rem;color:#666}
@media print{body{background:#fff}.w>*:not(.kartu){display:none}.kartu{margin:0 auto}}
</style></head><body><div class="w">
<h2>Buat QR Menu</h2><p class="cat">Tempel alamat web menu (setelah diunggah), lalu cetak. Ini QR biasa untuk membuka menu, <b>bukan QRIS</b> untuk pembayaran.</p>
<input id="u" type="url" placeholder="https://nama-anda.netlify.app/"><button id="b">Buat QR</button><button id="p" onclick="print()" style="background:#b9722a">Cetak</button>
<div class="kartu"><b>Pojok Kopi Dusun</b><h2>Scan untuk lihat menu</h2><canvas id="c" width="10" height="10"></canvas><small id="t">Isi alamat web di atas</small></div></div>
<script src="js/qrcode.js"></script>
<script>
const u=document.getElementById('u');u.value=new URLSearchParams(location.search).get('u')||localStorage.menuUrl||'';
function go(){const v=u.value.trim();if(!/^https?:\/\//.test(v)){alert('Alamat harus diawali https://');return}localStorage.menuUrl=v;
const q=qrcode(0,'M');q.addData(v);q.make();const n=q.getModuleCount(),Q=3,k=10,z=(n+2*Q)*k,c=document.getElementById('c');c.width=c.height=z;
const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,z,z);g.fillStyle='#000';for(let r=0;r<n;r++)for(let i=0;i<n;i++)if(q.isDark(r,i))g.fillRect((i+Q)*k,(r+Q)*k,k,k);
document.getElementById('t').textContent=v}
document.getElementById('b').onclick=go;if(u.value)go();
</script></body></html>
